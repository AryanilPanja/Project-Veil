[project]
name = "project-veil"
version = "0.1.0.dev0"
description = "Pseudonymize personal information into a consistent persona before it reaches an AI provider"
readme = "README.md"
requires-python = ">=3.13"
# No `license` yet: the owner decides before any public release (TODO-later).
# No `authors`: keep personal contact data out of committed files.
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.2",
    "pyrage>=1.4,<2",
    "keyring>=25.6",
]

[project.scripts]
veil = "veil.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.170",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "veil"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "T20", "BLE", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
# ui.py is the only module allowed to print (ADR-0027).
"src/veil/ui.py" = ["T20"]
# Tests: asserts, prints in subprocess snippets, synthetic "secrets" (S105) and running
# sys.executable in subprocesses (S603) are intentional.
# RUF001: tests use confusable Unicode (full-width, Greek, Indic digits) on purpose.
# E501: inline YAML test documents read better unsplit; source code keeps the 100 limit.
"tests/**" = ["S101", "T20", "S105", "S603", "RUF001", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yaml.load".msg = "use veil.persona.yamlio.load_yaml"
"yaml.safe_load".msg = "use veil.persona.yamlio.load_yaml"
"tempfile.NamedTemporaryFile".msg = "plaintext may only be written to the validated runtime dir"
"logging".msg = "no logging of persona data; use veil.ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
markers = ["slow_scrypt: uses real age scrypt (about 1.5 s per call)"]
