    sub_domains: { real: [research.xyz.example.test], fake: [research.abc.example.test] }
    department:  { real: CSE, policy: KEEP }
    lab:         { real: Vision Lab, fake: Signal Group, allow_short: true, aliases: { real: [VL], fake: [SG] } }
