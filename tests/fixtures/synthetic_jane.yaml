# SYNTHETIC test persona: every value is invented (Jane Doe → Alex Smith).
# Used by the test suite only. Never put real data here.
# (Named without "persona" + ".yaml" so the agent deny rules don't block commands that mention it.)
version: "1"
fidelity: semantic

person:
  first_name:   { real: Jane, fake: Alex }
  short_name:   { real: Janie, fake: Al, allow_short: true }
  last_name:    { real: Doe, fake: Smith, allow_short: true }
  full_name:    { real: Jane Doe, fake: Alex Smith }
  middle_name:  { real: "", fake: "" }
  nicknames:
    - { real: JD, fake: AS, allow_short: true }
  name_in_other_scripts:
    - { real: জেন, fake: অ্যালেক্স, allow_short: true }      # Bengali
    - { real: जेन, fake: एलेक्स, allow_short: true }         # Devanagari
    - { real: ஜேன், fake: அலெக்ஸ் }       # Tamil
  gender:        { real: f, fake: f }
  pronouns:      { real: she/her, fake: she/her }
  date_of_birth: { real: "14/03/2001", fake: "", policy: SHIFT }
  hometown:      { real: Springfield, fake: Rivertown }
  hometown_aliases: { real: [Springfield City], fake: [Rivertown City] }
  home_state:    { real: Northshire, fake: Southshire }
  current_city:  { real: Metro City, policy: KEEP }
  languages:     { real: English, policy: KEEP }

emails:
