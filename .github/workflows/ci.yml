name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Node 24 majors (Node 20 actions are deprecated). TODO-later: pin to full commit SHAs
      # (e.g. with `pinact`); Dependabot keeps them current either way.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24" # same uv as local development, so `uv sync --locked` behaves alike
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Property tests (stress profile)
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -q tests/unit/test_containment.py tests/unit/test_normalize.py
