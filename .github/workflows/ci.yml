name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every commit is signed off (git commit -s)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Only hashes are printed: commit messages are contributor-controlled text.
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::commit ${commit:0:12} has no Signed-off-by line (git commit -s; see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit "$missing"

  test:
    name: lint + tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.24" # same uv as local development, so `uv sync --locked` behaves alike
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-project --output-file /tmp/veil-requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/veil-requirements.txt

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        env:
          # Shared runners are slower and noisier than a laptop; the local default is stricter.
          VEIL_PERF_BUDGET_MS: "1500"
        run: uv run pytest -q

      - name: Property tests (stress profile)
        env:
          HYPOTHESIS_PROFILE: ci
        run: >-
          uv run pytest -q
          tests/unit/test_containment.py tests/unit/test_normalize.py tests/unit/test_aho.py
          tests/unit/test_variants.py tests/unit/test_compose.py tests/unit/test_matcher.py
          tests/unit/test_academic.py tests/unit/test_generate.py
